- type: text
  notiz: Gerne möchten wir die Büchereien weiter ausba…
  inhalt: <p>Gerne möchten wir die Büchereien weiter ausbauen und zusätzliche Bücher kaufen. Perspektivisch wären auch die Installation von WLAN (11 Euro/Monat) und ein Laptop grandios – die Kinder haben bisher keinen Zugang zum Internet und damit äußerst eingeschränkte Recherchemöglichkeiten. Über die aktuellen Fortschritte informieren wir auf unserem <a href="https://www.instagram.com/one4one_ev/" rel="noopener" target="_blank">Instagram</a>-Kanal.</p>
