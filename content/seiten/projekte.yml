- type: text
  notiz: Mittlerweile gibt es eine Auswahl an Büchern…
  inhalt: |-
    <p>Mittlerweile gibt es eine Auswahl an Büchern – vor allem Schulbücher, die zu teuer sind, als dass die Familien oder die Schulen in den Slums sie vorrätig haben können. Dazu kommen Märchenbücher, einfache Romane und gespendete Second-Hand-Spiele aus Deutschland. Die Bücherei wurde vom ersten Tag an mit großer Begeisterung angenommen: Die Kinder kommen zahlreich nach der Schule, und einige Schulen nutzen den Raum abwechselnd am Vormittag für ihren Unterricht. Am Wochenende kocht das Team Porridge für die Kinder, die die Bücherei besuchen – so ist auch am Wochenende mindestens eine Mahlzeit gesichert.</p>
    <p>Am Ostermontag 2026 folgte die zweite Bücherei in Mathare – eingeweiht mit einem kenianischen Eröffnungstag voller Tanz und Musik und einem zweiwöchigen Ferien-Nachhilfeprogramm. Wie in Korogocho ist auch hier bereits ein Ort entstanden, an dem die Kinder fast jede freie Minute verbringen. In Korogocho hat das Team zudem ein Diskussionsformat eingeführt: Jeden Freitagabend bereiten die Kinder ein Thema vor und tauschen Argumente aus – ein Format, das Sprache, differenziertes Denken und Selbstbewusstsein fördert und viel Spaß bringt.</p>
