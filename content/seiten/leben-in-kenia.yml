- type: text
  inhalt: |-
    <h2>Zwischen Wachstum und Existenzminimum</h2>
    <p>Kenia zählt seit 2014 zu den Ländern mit niedrigem mittlerem Einkommen. Doch Korruption, die Coronapandemie, extreme Wetterlagen mit Dürren und Überschwemmungen sowie stetig steigende Lebensmittelpreise haben die Armut zuletzt wieder wachsen lassen.</p>
    <p>2023 lebten laut Weltbank rund 35 % der Menschen in Kenia unter der Armutsgrenze – mit weniger als 2 Euro am Tag. Auf der Suche nach Arbeit ziehen immer mehr junge Menschen vom Land in die Städte. Weil dort kaum Arbeitsplätze warten, arbeiten rund 85 % im informellen Sektor als Tagelöhner, Fahrer oder Handwerker. In Nairobi leben etwa 60 % der 4,4 Millionen Einwohner in rund 200 Slums.</p>
