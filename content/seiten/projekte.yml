  notiz: ▸ SCHULBILDUNG
  element: section
  anker: schulbildung
  wrap_klasse: wrap prose
  eyebrow: Schulbildung
- type: text
  notiz: 237 Kinder auf dem Weg durch die Schule
  inhalt: |-
    <h2>237 Kinder auf dem Weg durch die Schule</h2>
    <p>Gründungsgedanke unseres Vereins ist es, bedürftigen Kindern den Besuch der Schule zu ermöglichen. Denn obwohl Schulbildung in Kenia seit 2003 offiziell kostenlos ist, sieht die Realität leider anders aus: Erstens gibt es vor allem in den Slums viel zu wenige öffentliche Schulen, und zweitens fallen auch dort Gebühren an – etwa für Schuluniformen oder Prüfungen. Viele Kinder gehen deshalb gar nicht oder nicht dauerhaft zur Schule. Andere Familien verschulden sich, um ihren Kindern den Schulbesuch doch zu ermöglichen – in der Hoffnung, bald (wieder) Arbeit zu finden.</p>
    <p>Der Schulbesuch bedeutet in Kenia dabei nicht nur Bildung und die damit verbundene Chance auf soziale Teilhabe und Aufstieg. Er bedeutet auch zwei Mahlzeiten am Tag – vormittags Porridge, nachmittags Ugali, Reis oder Bohnen. Für diese Kinder ist das leider keine Selbstverständlichkeit.</p>
- type: bildreihe
  notiz: '2 Bilder: Schule bedeutet Bildung – und zwei…'
  bilder:
  - bild: bilder/schule-maedchen.jpg
    alt: Mädchen im Unterricht
    unterschrift: Schule bedeutet Bildung – und zwei Mahlzeiten am Tag.
  - bild: bilder/schule-lernen.jpg
