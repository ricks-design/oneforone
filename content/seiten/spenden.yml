  inhalt: <h2>Gut zu wissen, bevor du spendest</h2>
- type: faq
  notiz: 5 Fragen
  eintraege:
  - frage: Kommt meine Spende wirklich vollständig an?
    antwort: Ja. One for One arbeitet komplett ehrenamtlich – keine Gehälter, keine Verwaltungskosten. Deine Spende geht per Onlineüberweisung direkt an unser Team in Kenia. Lediglich für die Überweisung fallen minimale Bankgebühren an (ca. 0,5 % des Gesamtspendenvolumens).
  - frage: Woher wisst ihr, dass das Geld korrekt verwendet wird?
    antwort: Die Schulgebühren werden von unserem Team vor Ort pro Term direkt an die Schulen gezahlt – das Geld läuft nicht über die Familien. Mit unseren Mitarbeitenden vor Ort stehen wir in engem, täglichem Austausch, und Vereinsmitglieder besuchen die Projekte regelmäßig persönlich. Über Newsletter und <a href="https://www.instagram.com/one4one_ev/" rel="noopener" target="_blank">Instagram</a> berichten wir transparent, was mit den Spenden passiert.
  - frage: Bekomme ich eine Spendenbescheinigung?
    antwort: Als eingetragener gemeinnütziger Verein stellen wir dir auf Wunsch eine Zuwendungsbestätigung aus. Gib bei der Überweisung deine Adresse an oder melde dich per E-Mail.
  - frage: Wie funktioniert eine Patenschaft?
    antwort: Mit einer regelmäßigen Spende begleitest du gezielt ein Kind – idealerweise durch die gesamte Schullaufbahn. Schreib uns an info@one-for.one, dann besprechen wir alle Details und finden eine passende Patenschaft. Aktuell werden bereits 62 Kinder durch direkte Patenschaften gefördert.
  - frage: Wie bleibe ich auf dem Laufenden?
    antwort: Über <a href="https://www.instagram.com/one4one_ev/" rel="noopener" target="_blank">Instagram</a> (@one4one_ev) und unseren <a href="https://whatsapp.com/channel/0029VbCTFaIA89Mj8QeWo72G" rel="noopener" target="_blank">WhatsApp-Kanal</a> teilen wir regelmäßig Updates aus Korogocho und Mathare – dazu ein bis zwei ausführliche Newsletter im Jahr.
