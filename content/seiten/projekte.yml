- type: text
  notiz: Wie schaffen wir es, die Kinder in die Schule…
  inhalt: |-
    <h3>Wie schaffen wir es, die Kinder in die Schule zu schicken?</h3>
    <p>Die Antwort lautet: Teddy und Joseph. Die beiden sind vor Ort bestens vernetzt und bekommen regelmäßig von entsprechenden Schicksalen berichtet. Da wir (noch) nicht allen Kindern den Schulbesuch ermöglichen können, haben wir gemeinsam einen Evaluationsbogen entwickelt, aus dem sich eine faire Rang- und Warteliste ergibt. Durch die großzügige Unterstützung unserer Spenderinnen und Spender konnten wir bereits nach nicht einmal einem halben Jahr seit der Vereinsgründung 2024 über 100 Kinder in die Schule schicken – heute sind es <strong>237 Kinder an rund 50 verschiedenen Schulen</strong>. Ist ein Kind einmal aufgenommen, begleiten wir es möglichst durch die gesamte Schullaufbahn. Die Gebühren zahlen wir pro Term direkt an die Schulen.</p>
    <h3>Was genau zahlen wir mit dem uns anvertrauten Geld?</h3>
    <ul><li>Aufnahme- und Schulgebühren (pro Term)</li><li>Prüfungsgebühren</li><li>Schuluniform</li><li>Bücher</li><li>Schulessen / Porridge</li><li>Schulschulden, falls vorhanden – viele Schulen kommen uns entgegen und erlassen „unseren“ Kindern einen erheblichen Teil der angehäuften Schulden</li></ul>
    <h3>Was wir nicht zahlen</h3>
    <ul><li>Stifte, Hefte und Verbrauchsmaterial</li><li>Ausflüge</li></ul>
- type: abschnitt
  notiz: ▸ DIE BÜCHEREIEN
