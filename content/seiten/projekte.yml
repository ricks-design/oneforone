- type: text
  notiz: Jeden Samstag eine warme Mahlzeit
  inhalt: |-
    <h2>Jeden Samstag eine warme Mahlzeit</h2>
    <p>Mangelernährung ist in den Slums von Nairobi Alltag. Deshalb gibt es jeden Samstag in Ngomongo, Korogocho, eine Porridge-Ausgabe. Was als Initiative des Teams vor Ort begann, versorgt heute 150 bis 250 Kinder pro Woche mit einer warmen Mahlzeit. Zusätzlich hat das Team eine große Lebensmittelspende über Foodbank Kenya organisieren können.</p>
