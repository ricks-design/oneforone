- type: html
  notiz: Drei Geschichten (Zitate)
  html: |-
    <p class="lead">Bei unseren Besuchen in Kenia dürfen wir tief in das Leben vieler Familien eintauchen.</p>
    <div class="story-grid">
    <div class="story"><p class="q">Raphael und seine Frau haben alle fünf Enkelkinder bei sich aufgenommen – ohne zu zögern. Sein Haus hat er mit eigenen Händen gebaut.</p><div class="who">Familie Ouma</div><div class="role">Schulgebühren für alle fünf Kinder</div></div>
    <div class="story"><p class="q">Caroline zieht vier Kinder allein groß – mit dem geringen Lohn aus dem Verkauf von Samosas und Wäschewaschen. Ihre älteste Tochter hat gerade die weiterführende Schule abgeschlossen.</p><div class="who">Caroline Atieno</div><div class="role">Frauenpower in Korogocho</div></div>
    <div class="story"><p class="q">Vickstone hat im Examen so gut abgeschnitten, dass er ein Regierungsstipendium erhielt – unser erster Stipendiat besucht nun ein sehr gutes Internat in Nairobi.</p><div class="who">Vickstone</div><div class="role">Erster One-for-One-Stipendiat</div></div>
    </div>
    <div style="margin-top:32px"><a class="btn-solid" href="kinder.html">Alle Geschichten lesen</a></div>
