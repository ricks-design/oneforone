- type: text
  notiz: Dickens, Travis, Wesley, Morgan und Sharlin w…
  inhalt: |-
    <p>Dickens, Travis, Wesley, Morgan und Sharlin wachsen bei ihren Großeltern auf. Ihre Eltern können sich weder emotional noch finanziell um sie kümmern – und so haben Raphael Ouma und seine Frau ohne zu zögern alle fünf Kinder bei sich aufgenommen.</p>
    <p>Raphael arbeitet als Schreiner. Voller Stolz zeigt er uns sein Zuhause, das er mit eigenen Händen gebaut und eingerichtet hat. Zwischen selbstgemachten Möbeln erzählt er von den Herausforderungen des Alltags – und davon, wie wichtig es ihm ist, seinen Enkelkindern Halt und Sicherheit zu geben.</p>
    <p>Umso mehr freut es uns, Raphaels beeindruckendes Engagement zu unterstützen: Wir übernehmen die Schulgebühren für alle fünf Kinder und hoffen, den Alltag der Familie damit ein Stück leichter zu machen.</p>
