- type: text
  notiz: Die kleine Sarah haben wir in unserer Büchere…
  inhalt: |-
    <p>Die kleine Sarah haben wir in unserer Bücherei kennengelernt. Teddy hat ihre Familie besucht, um herauszufinden, wie die Situation zu Hause ist: Sarah trägt jeden Tag die gleiche zerrissene Kleidung und ist auffallend dünn.</p>
    <p>In ihrem circa acht Quadratmeter großen Zimmer lebt sie mit sechs ihrer acht Geschwister und beiden Eltern. Ihr Vater erzählt von seinen Sorgen und der täglichen Herausforderung, als Tagelöhner genug Geld aufzutreiben, um seinen Kindern wenigstens eine Mahlzeit zu ermöglichen. Während er spricht, ringt er immer wieder mit den Tränen.</p>
    <p>Dank eurer Unterstützung können wir die Schulgebühren für Sarah und ihre Geschwister übernehmen. Für die Familie bedeutet das etwas weniger tägliche Sorge – und für die Kinder die Chance, unbeschwerter zu lernen und zu wachsen.</p>
