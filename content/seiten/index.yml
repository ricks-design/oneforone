- type: projektkacheln
  notiz: 6 Projekte
  kacheln:
  - schluessel: bibliotheken
    titel: Die Büchereien
    text: Zwei Orte zum Lesen, Lernen und Ankommen – in Korogocho und Mathare.
    bild: bilder/bib-ko-aussen.jpg
    alt: Die One for One Library
    popup:
      bild: bilder/bib-ko-aussen.jpg
      titel: Die Büchereien
      text: <p>Im Februar 2025 haben wir in Korogocho auf rund 15 m² eine Bücherei eröffnet, am Ostermontag 2026 folgte eine zweite in Mathare. Beide stehen jedem Kind offen – unabhängig davon, ob es gerade zur Schule geht.</p><p>Neben Schulbüchern gibt es Märchen, einfache Romane und gespendete Spiele. Die Kinder machen hier Hausaufgaben, lernen gemeinsam oder spielen einfach.</p><div class="m-fact">Montag bis Samstag, 11–19 Uhr · Korogocho (Ngomongo) und Mathare North, Area 3</div>
      link: projekte.html#bibliotheken
      linktext: Mehr über die Büchereien
  - schluessel: schulbildung
    titel: Schulbildung
    text: Schulgebühren, Uniformen, Bücher – wir räumen die Hürden aus dem Weg.
    bild: bilder/schule-maedchen.jpg
    alt: Lernen
    popup:
      bild: bilder/schule-maedchen.jpg
      titel: Schulbildung
      text: '<p>Obwohl Schule in Kenia seit 2003 offiziell kostenlos ist, sieht die Realität anders aus: zu wenige öffentliche Schulen, dazu Gebühren für Uniform, Prüfungen und Material.</p><p>Gemeinsam mit Teddy und Joseph haben wir einen Evaluationsbogen entwickelt, aus dem sich eine faire Warteliste ergibt. Ist ein Kind aufgenommen, begleiten wir es möglichst durch die ganze Schullaufbahn.</p><div class="m-fact">Aktuell zahlen wir die Schulgebühren für 237 Kinder an rund 50 verschiedenen Schulen.</div>'
      link: projekte.html#schulbildung
      linktext: Mehr zur Schulbildung
  - schluessel: porridge
    titel: Porridge-Programm
    text: Jeden Samstag eine warme Mahlzeit für 150–250 Kinder.
    bild: bilder/porridge-becher5.jpg
    alt: Porridge-Ausgabe
    popup:
      bild: bilder/porridge-becher5.jpg
      titel: Porridge-Programm
      text: <p>Mangelernährung ist in den Slums von Nairobi Alltag. Deshalb gibt es jeden Samstag in Ngomongo, Korogocho, eine Porridge-Ausgabe.</p><p>Was als Initiative des Teams vor Ort begann, versorgt heute 150 bis 250 Kinder pro Woche mit einer warmen Mahlzeit.</p><div class="m-fact">Zusätzlich hat das Team eine große Lebensmittelspende über Foodbank Kenya organisiert.</div>
      link: projekte.html#porridge
      linktext: Zum Porridge-Programm
  - schluessel: center
    titel: Community Center
    text: '400 m² für die Zukunft: Bibliothek, Unterricht, Nähraum, Küche.'
    bild: bilder/cc-skizze2.jpg
    alt: Skizze Community Center
    popup:
      bild: bilder/cc-skizze2.jpg
      titel: Community Center
      text: <p>Dank einer Großspende konnten wir mitten im Herzen von Korogocho ein rund 400 m² großes Grundstück erwerben. Die Abrissarbeiten haben begonnen, ein zweiter Architekten-Entwurf wird ausgearbeitet.</p><p>Geplant sind Bibliothek, Unterrichtsraum, Nähraum, Küche, Büro, Toiletten, Spielraum und ein Außenbereich.</p><div class="m-fact">Im Bau-Tagebuch begleitet ihr jeden Schritt – vom Grundstück bis zur Eröffnung.</div>
      link: community-center.html
      linktext: Zum Bau-Tagebuch
  - schluessel: naehprojekt
    titel: Nähprojekt
    text: Maureen und Linet nähen im Raum neben der Bücherei in Korogocho.
    bild: bilder/naehen-maureen-tasche.jpg
    alt: Nähprojekt
    popup:
      bild: bilder/naehen-maureen-tasche.jpg
      titel: Nähprojekt
      text: <p>In einem Raum direkt neben der Bücherei in Korogocho nähen Maureen und Linet – das Nähen beigebracht hat den beiden Marion.</p><p>Heute arbeiten sie eigenständig und schaffen sich damit ein eigenes Einkommen.</p><div class="m-fact">Im künftigen Community Center bekommt das Nähprojekt einen eigenen, größeren Raum.</div>
      link: projekte.html#naehprojekt
      linktext: Mehr zum Nähprojekt
  - schluessel: hausaufgaben
    titel: Hausaufgabenbetreuung
    text: Unterstützung beim Lernen – von Menschen aus der Nachbarschaft.
    bild: bilder/nachhilfe-lernen.jpg
    alt: Hausaufgabenbetreuung
    popup:
      bild: bilder/nachhilfe-lernen.jpg
      titel: Hausaufgabenbetreuung
      text: <p>Zuhause fehlt oft der Platz, das Licht oder die Ruhe zum Lernen. In unseren Büchereien finden die Kinder beides – und Menschen, die ihnen helfen.</p><p>Unsere Mentorinnen und Mentoren kommen selbst aus Korogocho und Mathare.</p><div class="m-fact">In den Schulferien bieten wir zusätzliche Nachhilfeprogramme an.</div>
      link: projekte.html#hausaufgaben
      linktext: Mehr erfahren
