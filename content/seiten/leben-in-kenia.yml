- type: text
  inhalt: |-
    <h2>Kenias Schulsystem</h2>
    <p>Seit 2003 ist der Besuch der Grundschule offiziell kostenlos. 2023 wurde zudem das Schulsystem erneuert – mit dem Ziel, die Bedürfnisse der stetig wachsenden Bevölkerung zu bedienen. Die Reform soll bis 2027 vollständig umgesetzt sein. Sie sieht eine zweijährige Vorschule vor, gefolgt von sechs Jahren Grundschule und den weiterführenden Schulen: der „Junior Secondary School“ und der „Senior Secondary School“ mit jeweils drei Jahren Unterricht. Im Anschluss besteht die Möglichkeit, für drei weitere Jahre an der Universität zu studieren.</p>
- type: html
  html: |-
    <div class="ksys">
    <div class="ky"><b>2</b><span>Preprimary</span></div><div class="karr">→</div>
    <div class="ky"><b>6</b><span>Primary</span></div><div class="karr">→</div>
    <div class="ky"><b>3</b><span>Junior Secondary</span></div><div class="karr">→</div>
    <div class="ky"><b>3</b><span>Senior Secondary</span></div><div class="karr">→</div>
    <div class="ky"><b>3</b><span>University</span></div>
    </div>
    <p class="ksys-note"><strong>Dauer in Jahren.</strong> Einschulung mit durchschnittlich 4 Jahren. Nach dem Examen der 9. Klasse folgt ein obligatorischer Schulwechsel – je nach Note und gewähltem Schwerpunkt.</p>
- type: text
  inhalt: |-
    <p>Das neue System soll dazu führen, dass die landesweiten Abschlussprüfungen weniger stark gewichtet werden und die unterschiedlichen Talente der Schülerinnen und Schüler mehr Raum bekommen. Auf dem Papier klingt das richtig gut – die gelebte Praxis sieht leider anders aus: Im ganzen Land fehlen Lehrkräfte, das Lehrer-Schüler-Verhältnis hat sich auf etwa 1:100 verschlechtert. Gerade in den Slums wachsen Klassen teilweise auf 200 bis 300 Kinder an. Wer eine bessere Betreuung für seine Kinder möchte, bleibt gezwungen, Schulgeld für eine der vielen Privatschulen aufzubringen.</p>
    <p>Und selbst an den öffentlichen Grundschulen entfallen lediglich die Schulgebühren. Es bleiben die Kosten für Essen, Schuluniform, Bücher, Hefte und Stifte – dazu Gebühren für die Aufnahme oder die Teilnahme an den jährlichen Abschlussprüfungen. Wer ohne die entsprechende Ausrüstung erscheint, wird wieder nach Hause geschickt. So schaffen es aktuell 3 von 10 Kindern nicht, bis zur Abschlussprüfung an der Grundschule zu bleiben.</p>
    <p>Weiterführende Schulen sind kostenpflichtige Gesamtschulen – der Besuch kostet im Schnitt rund einen Euro am Tag. Für große Teile der Bevölkerung sind sie damit unzugänglich, auch wenn Privatschulen vereinzelt Stipendien vergeben. Nur 37,5 % der Jugendlichen in Kenia schaffen es auf eine weiterführende Schule; 13,7 % der Absolventen qualifizieren sich anschließend für die Universität.</p>
