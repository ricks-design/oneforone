- type: html
  notiz: 1 → 1 und Spendenverteilung
  html: |-
    <div class="one2one-grid">
    <div><div class="big11">1 <span class="arrow">→</span> 1</div></div>
    <div><p class="body"><strong>Jeder gespendete Euro kommt an.</strong> Wir arbeiten komplett ehrenamtlich – ohne Verwaltungsapparat, ohne Bürokosten. Deine Spende geht per Onlineüberweisung direkt an unser Team in Kenia und wird dort vor Ort eingesetzt: für Schulgebühren, die Büchereien, Porridge und die Menschen, die alles am Laufen halten.</p></div>
    </div>
    <div class="flowcard">
    <div class="flow-top">
    <h3>Was passiert mit deiner Spende?</h3>
    <div class="flow-strip"><b>Deine Spende</b><span class="fsep">→</span><b>Direkt nach Kenia</b><span class="fsep">→</span><b>Einsatz vor Ort</b></div>
    </div>
    <div aria-label="82 % Schulgebühren, 10 % Bücherei, 5 % Freiwillige, 3 % Porridge" class="stackbar" role="img">
    <i class="s1" style="width:82%"></i><i class="s2" style="width:10%"></i><i class="s3" style="width:5%"></i><i class="s4" style="width:3%"></i>
    </div>
    <div class="legend">
    <span class="lg"><i class="d1"></i>Schulgebühren <b>82 %</b></span>
    <span class="lg"><i class="d2"></i>Bücherei <b>10 %</b></span>
    <span class="lg"><i class="d3"></i>Freiwillige vor Ort <b>5 %</b></span>
    <span class="lg"><i class="d4"></i>Porridge-Zutaten <b>3 %</b></span>
    </div>
    <p class="flow-note">Pro Überweisung an unser Team nach Kenia fallen minimale Bankgebühren an – gerechnet auf das Gesamtspendenvolumen ca. 0,5 %.</p>
    </div>
