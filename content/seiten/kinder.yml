  html: <div class="krole">Frauenpower in Korogocho</div>
- type: text
  notiz: Als Velmas Mutter Caroline Atieno 2012 ihr vi…
  inhalt: |-
    <p>Als Velmas Mutter Caroline Atieno 2012 ihr viertes Kind zur Welt bringt, trennt sie sich vom Vater ihrer Kinder – eine Entscheidung, die sie aus eigener Kraft getroffen hat, nachdem sie häusliche Gewalt erlebt hatte. Seitdem trägt sie die Verantwortung für die Familie allein und verdient ihren Lebensunterhalt, indem sie Samosas zubereitet und Wäsche in der Nachbarschaft wäscht.</p>
    <p>Wir bewundern Carolines Mut und ihre Stärke, jeden Tag für sich und ihre Kinder einzustehen. Sie ist eine von vielen beeindruckenden alleinerziehenden Frauen in den Slums von Nairobi, die ihren Alltag mit Würde, Entschlossenheit und enormer Kraft meistern.</p>
    <p>Ihr Selbstbewusstsein und ihre Unabhängigkeit spiegeln sich schon jetzt in ihren beiden Töchtern wider: Die älteste hat gerade die weiterführende Schule abgeschlossen und möchte mit einer Ausbildung im Gastronomiebereich bald dazu beitragen, ihre Mutter finanziell zu entlasten.</p>
