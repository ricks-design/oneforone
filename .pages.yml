- name: neuigkeiten
  label: Neuigkeiten (Beiträge)
  type: collection
  description: Jeder Beitrag wird eine eigene Seite und erscheint in der Übersicht „Neuigkeiten“.
  path: content/neuigkeiten
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - titel
    - datum
