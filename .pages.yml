        - name: datum
          label: Datum / Status
          type: string
          description: z. B. „Mai 2026 · Erledigt“
        - name: titel
          label: Titel
          type: string
        - name: text
          label: Text
          type: text
        - name: zukunft
          label: Noch geplant (heller dargestellt)
