- type: text
  notiz: Ferien-Nachhilfeprogramm
  inhalt: |-
    <h3>Ferien-Nachhilfeprogramm</h3>
    <p>In den Schulferien bieten wir ein kostenloses Nachhilfeprogramm an – von Mathematik über Naturwissenschaften bis zu Diskussionsrunden. So bleibt der Lernfaden auch außerhalb der Schulzeit erhalten.</p>
