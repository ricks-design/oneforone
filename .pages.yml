      - name: zahlen
        label: Zahlen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{wert} · {text}'
        fields:
        - name: wert
          label: Zahl / Wert
          type: string
          description: z. B. 237 oder 150–250
        - name: text
          label: Beschriftung
          type: string
        - name: zaehlen
          label: Hochzählen (nur bei reinen Zahlen)
          type: boolean
        - name: akzent
          label: In Ocker hervorheben
          type: boolean
      - name: balken_titel
        label: Überschrift der Balken
        type: string
      - name: balken
        label: Balken
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{jahr}: {wert}'
        fields:
        - name: jahr
          label: Beschriftung (Jahr)
          type: string
        - name: wert
          label: Wert
          type: number
          description: Die Balkenhöhe wird automatisch im Verhältnis berechnet.
    - name: schulstufen
      label: Schulstufen-Grafik
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: stufen
        label: Stufen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}: {jahre} Jahre'
        fields:
        - name: name
          label: Name
          type: string
        - name: jahre
          label: Dauer in Jahren
          type: number
          description: Die Balkenlänge richtet sich nach der Dauer.
      - name: hinweis
        label: Hinweis unter der Grafik
        type: text
        description: HTML erlaubt, z. B. <strong>…</strong>
    - name: kostendiagramm
      label: Kostendiagramm (jährliche Kosten)
      description: Kreisdiagramm; Anteile und Gesamtsumme werden aus den Beträgen berechnet.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: posten
        label: Jährliche Posten
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}: {betrag} €'
        fields:
        - name: name
          label: Bezeichnung
          type: string
        - name: betrag
          label: Betrag pro Jahr (€)
          type: number
        - name: farbe
          label: Farbe
          type: select
          options:
            values:
            - value: gruen
              label: Grün
            - value: ocker
              label: Ocker
            - value: grau
              label: Grau
            - value: hell
              label: Hellgrau
      - name: summe_text
        label: Beschriftung der Summe
        type: string
        description: Die Summe selbst wird automatisch aus den Posten berechnet.
      - name: zusatz
        label: Weitere Zeilen (nicht in der Summe)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
        - name: name
          label: Bezeichnung
          type: string
        - name: hinweis
          label: Kleiner Zusatztext
          type: string
        - name: betrag_text
          label: Betrag als Text
          type: string
          description: z. B. „35 € einmalig“
      - name: fussnote
        label: Fußnote
        type: string
    - name: tabelle
      label: Tabelle (2 Spalten)
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: titel
        label: Überschrift
        type: string
      - name: spalte_1
        label: Kopf Spalte 1
        type: string
        default: Beschreibung
      - name: spalte_2
        label: Kopf Spalte 2
        type: string
        default: Kosten
      - name: zeilen
        label: Zeilen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{beschreibung}: {wert}'
        fields:
        - name: beschreibung
          label: Beschreibung
          type: string
        - name: wert
          label: Wert
          type: string
    - name: wirkungsrechner
      label: Wirkungsrechner
      description: Die Beispiele je Betrag stehen unter Einstellungen → Wirkungsrechner.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: startwert
        label: Startbetrag (€)
        type: number
        default: 25
      - name: schnellwahl
        label: Schnellwahl-Beträge (€)
        type: number
        list: true
        description: Buttons unter dem Schieberegler. Werte zwischen 5 und 200.
      - name: button_text
        label: Button-Text
        type: string
      - name: button_link
        label: Button-Link
        type: string
      - name: hinweis
        label: Kleingedrucktes
        type: text
    - name: cta
      label: Aufruf-Band (Button)
      description: Farbiges Band mit Button. Steht für sich, nicht in einem Abschnitt.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: titel
        label: Text
        type: string
      - name: button
        label: Button-Text
        type: string
      - name: link
        label: Link
        type: string
    - name: html
      label: HTML im Abschnitt
      description: Für Sonderelemente mit eigenem Markup.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: html
        label: HTML
        type: code
        options:
          format: html
        description: 'Platzhalter: {{ e.iban }}, {{ e.bic }}, {{ e.bank }}, {{ e.kontoinhaber }}, {{ e.paypal_link }}'
    - name: html_bereich
      label: HTML-Bereich (eigenständig)
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: html
        label: HTML
        type: code
        options:
          format: html
        description: Kompletter Bereich inkl. <section>.
