  inhalt: |-
    <h2>Unterstützung beim Lernen</h2>
    <p>Zuhause fehlt oft der Platz, das Licht oder die Ruhe zum Lernen. In unseren Büchereien finden die Kinder beides – und Menschen, die ihnen helfen. Unsere Mentorinnen und Mentoren kommen selbst aus Korogocho und Mathare. In den Schulferien bieten wir zusätzliche Nachhilfeprogramme an.</p>
