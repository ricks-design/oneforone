seitentitel: Community Center | One for One
beschreibung: Auf 400 m² in Korogocho entsteht ein Zentrum für Kinder und Jugendliche. Grundstück gekauft, Abriss läuft – begleite den Bau.
bloecke:
- type: seitenkopf
  brotkrume: Community Center
  titel: Das Community Center entsteht
  text: Vom Grundstück zum Herzstück von Korogocho – begleite jeden Schritt.
- type: abschnitt
  element: section
  wrap_klasse: wrap prose
  eyebrow: Good things are coming
- type: text
  inhalt: |-
    <h2>Ein Ort für die ganze Community</h2>
    <p>Dank einer Großspende konnten wir mitten im Herzen von Korogocho ein rund <strong>400 m² großes Grundstück</strong> erwerben. Hier soll ein Zentrum für Kinder und Jugendliche entstehen: ein Ort zum Kindsein, zum Lernen und Arbeiten für eine bessere Zukunft, ein Ort der Gemeinschaft und des Zusammenkommens. Geplant sind unter anderem eine Bibliothek, ein Unterrichtsraum, ein Nähraum, eine Küche, ein Büro, Toiletten, ein Spielraum und ein Außenbereich.</p>
    <p>Unsere Träume sind groß und die Pläne werden konkreter: Ein zweiter Architekten-Entwurf wird derzeit ausgearbeitet, Marion steht bereits in Kontakt mit einem ortsansässigen Bauunternehmer, und die Prüfung für eine Förderung im Kleinprojektefonds läuft.</p>
