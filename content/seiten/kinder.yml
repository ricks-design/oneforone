  html: <div class="krole">Erster One-for-One-Stipendiat</div>
- type: text
  notiz: 2026 wurde in Kenia erstmals das reformierte…
  inhalt: |-
    <p>2026 wurde in Kenia erstmals das reformierte Schulsystem umgesetzt: In den letzten drei Schuljahren werden die Jugendlichen interessenspezifisch gefördert und je nach Examensnote und Präferenz einer Schule zugeteilt. Von unseren Kindern waren sechs von einem Schulwechsel betroffen – die Zuteilung kam teils erst in der Woche vor Schulstart, oft an weit entfernte Schulen. Durch viele Telefonate und großes Engagement von Teddy und Joseph hat am Ende alles gut funktioniert.</p>
    <p>Einen Jungen dürfen wir dabei besonders feiern: Vickstone hat im Examen so gut abgeschnitten, dass er ein Stipendium der Regierung erhalten hat und nun ein sehr gutes Internat in Nairobi besucht – unser erster Stipendiat. Zum Schuljahr 2027 werden 27 weitere Kinder die Schule wechseln.</p>
