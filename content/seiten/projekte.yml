  inhalt: |-
    <h2>Fähigkeiten, die bleiben</h2>
    <p>In einem Raum direkt neben der Bücherei in Korogocho nähen Maureen und Linet. Das Nähen beigebracht hat den beiden Marion – heute arbeiten sie eigenständig und schaffen sich damit ein eigenes Einkommen. Im künftigen Community Center bekommt das Nähprojekt einen eigenen, größeren Raum.</p>
