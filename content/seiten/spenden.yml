seitentitel: Spenden | One for One
beschreibung: Spende an One for One per PayPal oder Überweisung – oder übernimm eine Patenschaft. Jeder Euro kommt 1:1 an.
bloecke:
- type: seitenkopf
  notiz: Jeder Euro kommt 1 : 1 an
  brotkrume: Spenden
  titel: Jeder Euro kommt 1 : 1 an
  text: 'Wir versprechen euch: Jeder Euro kommt bei den Kindern vor Ort an. Bereits mit 1,50 Euro kann ein Kind beispielsweise eine ganze Woche in der Schule essen. Wir und die Kinder freuen uns wirklich über jeden Euro.'
