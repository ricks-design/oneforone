  karten:
  - bild: bilder/vorort-korogocho.jpg
    alt: Straße in Korogocho
    bildklasse: ph
    titel: Korogocho
    text: '<p>Der drittgrößte Slum Nairobis – übersetzt bedeutet der Name so viel wie „Durcheinander, Chaos, Abfall“. Er liegt unmittelbar am Fuß von Dandora, der einzigen Müllkippe der Stadt. Rund 150.000 Menschen wohnen hier, und viele von ihnen leben von der Müllkippe: Sie suchen im Müll nach Essbarem oder Wiederverwertbarem. Auch Kinder werden losgeschickt, um Müll zu sammeln und so zum Lebensunterhalt der Familie beizutragen.</p>'
  - bild: bilder/vorort-mathare.jpg
    alt: Kinder vor der Community Library in Mathare
    bildklasse: ph
    titel: Mathare Valley
    text: <p>Der älteste und mit rund 500.000 Einwohnern zweitgrößte Slum Nairobis. Die Menschen leben hier unter widrigen Bedingungen in notdürftig errichteten Wellblechhütten auf engstem Raum – ohne fließendes Wasser oder Abwassersystem. Es gibt nur wenige befestigte Straßen und lediglich instabile Stromleitungen. Da häufig auch Kinder und Jugendliche zum Lebensunterhalt beitragen oder auf jüngere Geschwister aufpassen müssen, statt zur Schule zu gehen, ist die Analphabetenrate in Mathare extrem hoch.</p>
