- type: text
  notiz: Zwei Orte zum Lernen, Spielen und Ankommen
  inhalt: |-
    <h2>Zwei Orte zum Lernen, Spielen und Ankommen</h2>
    <p>Teddy und Joseph hatten die Idee, eine Bibliothek zu eröffnen, die allen Kindern offensteht und ein Ort sein soll, an dem sie Unterstützung beim Lernen erhalten – unabhängig davon, ob sie aktuell eine Schule besuchen oder nicht. Diese Vision konnten wir im Februar 2025 in Korogocho in die Tat umsetzen: Auf circa 15 m² haben die Kinder dort jetzt einen Ort zum Lernen, Hausaufgabenmachen und Spielen. Wir haben den kleinen Raum gestrichen, Strom installiert, Möbel vor Ort bauen lassen und die Bücherei gemeinsam mit Teddy, Joseph und einigen ihrer Freunde eingerichtet.</p>
- type: bildreihe
  notiz: '3 Bilder: Korogocho: Die Bücherei ist Treffpu…'
