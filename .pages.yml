# Konfiguration für Pages CMS (https://app.pagescms.org)
#
# Inhalte liegen in content/, Bilder in bilder/. Nach jedem Speichern baut die
# GitHub Action die Website neu (Reiter „Actions“), nach ca. 1–2 Minuten ist sie online.
#
# Neuer Block-Typ: Template in templates/blocks/<name>.html anlegen und hier unter
# components → bloecke → blocks ergänzen (siehe README).

media:
  input: bilder
  output: bilder
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - heic
  - heif
  rename: safe
components:
  bloecke:
    label: Inhalt der Seite
    description: Blöcke von oben nach unten. „▸ Neuer Abschnitt“ beginnt einen Seitenabschnitt; die Blöcke danach gehören dazu.
    type: block
    list:
      collapsible:
        collapsed: true
        summary: '{notiz}'
    blockKey: type
    blocks:
    - name: hero
      label: Titelbild groß (Startseite)
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: bild
        label: Hintergrundbild
        type: image
      - name: alt
        label: Alternativtext
        type: string
      - name: eyebrow
        label: Zeile über dem Titel
        type: string
      - name: titel
        label: Titel
        type: string
        description: 'HTML erlaubt: <em>…</em> färbt die Stelle ocker'
      - name: text
        label: Untertitel
        type: text
      - name: buttons
        label: Buttons
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{text}'
        fields:
        - name: text
          label: Text
          type: string
        - name: link
          label: Link
          type: string
        - name: stil
          label: Stil
          type: select
          options:
            values:
            - value: primary
              label: Gefüllt
            - value: ghost
              label: Umriss
      - name: anker
        label: Anker-ID
        type: string
        description: 'Technisch: id-Attribut'
    - name: seitenkopf
      label: Seitenkopf (Unterseiten)
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: brotkrume
        label: Brotkrume
        type: string
        description: Text hinter „Home ›“
      - name: titel
        label: Titel
        type: string
      - name: text
        label: Untertitel
        type: text
    - name: abschnitt
      label: ▸ Neuer Abschnitt
      description: Beginnt einen neuen Seitenabschnitt. Alle folgenden Inhaltsblöcke gehören dazu.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: eyebrow
        label: Kleine Überschrift (Eyebrow)
        type: string
        description: Steht in Großbuchstaben über dem Abschnitt
      - name: anker
        label: Anker-ID
        type: string
        description: Für Sprunglinks, z. B. porridge → projekte.html#porridge
      - name: wrap_klasse
        label: Breite des Inhalts
        type: select
        default: wrap prose
        options:
          values:
          - value: wrap prose
            label: Lesetext (schmale Textspalte)
          - value: wrap
            label: Volle Breite
          - value: wrap patenband-inner
            label: Band (Text links, Button rechts)
      - name: stil
        label: Hintergrund / Inline-Stil (CSS)
        type: string
        description: Technisch, z. B. background:var(--white)
      - name: klasse
        label: CSS-Klasse
        type: string
        description: Technisch, z. B. kidstory, calc, patenband
      - name: element
        label: HTML-Element
        type: select
        default: section
        options:
          values:
          - value: section
            label: section
          - value: div
            label: div
    - name: text
      label: Text
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: inhalt
        label: Text
        type: rich-text
        options:
          format: html
    - name: einleitung
      label: Einleitungssatz (größer)
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: text
        label: Text
        type: text
    - name: bildreihe
      label: Bildreihe (2–3 Bilder)
      description: Bilder nebeneinander; ein Klick öffnet die Großansicht.
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: bilder
        label: Bilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{index} · {unterschrift}'
        fields:
        - name: bild
          label: Bild
          type: image
        - name: alt
          label: Alternativtext
          type: string
          description: Kurze Bildbeschreibung für Screenreader und Suchmaschinen
        - name: unterschrift
          label: Bildunterschrift
          type: string
    - name: galerie
      label: Bildmosaik
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: bilder
        label: Bilder
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{index} · {unterschrift}'
        fields:
        - name: bild
          label: Bild
          type: image
        - name: alt
          label: Alternativtext
          type: string
          description: Kurze Bildbeschreibung für Screenreader und Suchmaschinen
        - name: unterschrift
          label: Bildunterschrift
          type: string
        - name: lightbox
          label: Text in der Großansicht
          type: string
        - name: format
          label: Kachelgröße
          type: select
          default: normal
          options:
            values:
            - value: normal
              label: Normal
            - value: big
              label: Groß (2 × 2)
            - value: tall
              label: Hoch
            - value: wide
              label: Breit
      - name: anker
        label: Anker-ID
        type: string
    - name: personen
      label: Personen- / Bildkarten
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: karten
        label: Karten
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{titel}'
        fields:
        - name: bild
          label: Bild
          type: image
        - name: alt
          label: Alternativtext
          type: string
          description: Kurze Bildbeschreibung für Screenreader und Suchmaschinen
        - name: titel
          label: Titel
          type: string
        - name: text
          label: Text
          type: rich-text
          options:
            format: html
        - name: bildklasse
          label: Bildformat
          type: select
          default: ph ph-portrait
          options:
            values:
            - value: ph ph-portrait
              label: Hochformat
            - value: ph
              label: Querformat
      - name: raster
        label: Raster
        type: select
        default: teamgrid
        options:
          values:
          - value: teamgrid
            label: Team (3 Spalten)
          - value: vg
            label: Karten
      - name: stil
        label: Inline-Stil (CSS)
        type: string
        description: Technisch
    - name: projektkacheln
      label: Projekt-Kacheln mit Pop-up
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: kacheln
        label: Kacheln
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{titel}'
        fields:
        - name: titel
          label: Titel
          type: string
        - name: text
          label: Kurztext
          type: text
        - name: bild
          label: Bild
          type: image
        - name: alt
          label: Alternativtext
          type: string
        - name: popup
          label: Pop-up
          type: object
          fields:
          - name: bild
            label: Bild
            type: image
          - name: titel
            label: Titel
            type: string
          - name: text
            label: Text
            type: rich-text
            options:
              format: html
          - name: link
            label: Link
            type: string
          - name: linktext
            label: Linktext
            type: string
        - name: schluessel
          label: Interner Name
          type: string
          description: Eindeutig, ohne Leerzeichen, z. B. porridge
    - name: faq
      label: Fragen & Antworten
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: eintraege
        label: Einträge
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{frage}'
        fields:
        - name: frage
          label: Frage
          type: string
        - name: antwort
          label: Antwort
          type: rich-text
          options:
            format: html
    - name: zeitleiste
      label: Zeitleiste
      fields:
      - name: notiz
        label: Interne Bezeichnung
        type: string
        description: Nur für die Blockliste hier im CMS – erscheint nicht auf der Website.
      - name: eintraege
        label: Einträge
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{datum} — {titel}'
